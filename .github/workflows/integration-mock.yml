name: Integration Mock

on:
  push:
  pull_request:

jobs:
  integration-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --test io_mock
      - name: Run mock integration tests
        run: cargo test --test io_mock
