name: Fuzz Smoke

on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:

jobs:
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Run fuzz smoke
        run: cargo fuzz run j1939_frame_from_raw -- -max_total_time=120
