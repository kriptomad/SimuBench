name: Nightly Monte Carlo

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  nightly-montecarlo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: [reduced, high-fidelity]
        seed_batch: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Monte Carlo script
        run: bash scripts/run_monte_carlo.sh 1 ${{ matrix.model }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monte-artifacts-${{ matrix.model }}-${{ matrix.seed_batch }}
          path: artifacts/monte
