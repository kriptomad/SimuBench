[package]
name = "auto_breaking"
version = "0.3.0"
edition = "2021"
default-run = "auto_breaking"

[features]
default = []
advanced_observability = ["dep:tracing", "dep:tracing-subscriber"]
new_integrator = []
vendor-windows = []

[dependencies]
eframe    = { version = "0.36", default-features = true }
egui_plot = "0.29"
chrono    = "0.4"
serde     = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["fmt", "json"] }
thiserror = "2.0"
flate2 = "1.0"
serialport = "4.5"
rfd = "0.15"
rand = "0.8"
crc32fast = "1.4"
sha2 = "0.10"
# crossterm removed — replaced by egui desktop GUI

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = "3.3"

[dev-dependencies]
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "solver_bench"
harness = false
